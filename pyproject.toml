[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prunemaxxing"
version = "0.1.0"
description = "Autonomous mothership + drone swarm for urban pruning soil regeneration (AGR-E2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["prunemaxxing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
